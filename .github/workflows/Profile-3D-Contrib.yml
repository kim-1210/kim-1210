name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"   # 한국시간 03:00
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1   # 오타 수정!
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}                 # Secret 연결
          USERNAME:     ${{ github.repository_owner }}       # 오타 수정!

      - name: Commit & Push
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
        run: |
          git config user.name  "kim-1210"
          git config user.email "zxmzxm1324@gmail.com"
          git remote set-url origin https://github.com/kim-1210/kim-1210.git
          git add -A .
          git commit -m "generated" || echo "No changes"     # 충돌 방지
          git push https://$GITHUB_TOKEN@github.com/kim-1210/kim-1210.git
